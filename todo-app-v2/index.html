<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App v2 - Component Based</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app" class="app-container">
        <header class="app-header">
            <h1>TODO <span class="highlight">v2</span></h1>
            <p class="subtitle">Component-based task manager</p>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                <span class="theme-icon">&#9790;</span>
            </button>
        </header>

        <main class="app-main">
            <section class="input-section" aria-label="Add new task">
                <form id="todo-form" class="todo-form">
                    <div class="form-row">
                        <input
                            type="text"
                            id="todo-input"
                            class="todo-input"
                            placeholder="Add a new task..."
                            aria-label="Task description"
                            required
                            autocomplete="off"
                        >
                        <button type="submit" class="btn btn-primary" aria-label="Add task">
                            <span class="btn-icon">+</span>
                        </button>
                    </div>
                    <div class="form-options">
                        <div class="option-group">
                            <label for="priority-select" class="option-label">Priority:</label>
                            <select id="priority-select" class="select-input" aria-label="Task priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label for="category-select" class="option-label">Category:</label>
                            <select id="category-select" class="select-input" aria-label="Task category">
                                <option value="general">General</option>
                                <option value="work">Work</option>
                                <option value="personal">Personal</option>
                                <option value="shopping">Shopping</option>
                            </select>
                        </div>
                    </div>
                </form>
            </section>

            <section class="controls-section" aria-label="Filter and sort controls">
                <div class="filter-group">
                    <button class="btn btn-filter active" data-filter="all">All</button>
                    <button class="btn btn-filter" data-filter="active">Active</button>
                    <button class="btn btn-filter" data-filter="completed">Done</button>
                </div>
                <div class="sort-group">
                    <label for="sort-select" class="option-label">Sort:</label>
                    <select id="sort-select" class="select-input" aria-label="Sort tasks">
                        <option value="newest">Newest first</option>
                        <option value="oldest">Oldest first</option>
                        <option value="priority">Priority</option>
                        <option value="alphabetical">A-Z</option>
                    </select>
                </div>
            </section>

            <section class="search-section" aria-label="Search tasks">
                <input
                    type="search"
                    id="search-input"
                    class="search-input"
                    placeholder="Search tasks..."
                    aria-label="Search tasks"
                >
            </section>

            <section class="todo-section" aria-label="Task list">
                <ul id="todo-list" class="todo-list" role="list" aria-label="Tasks"></ul>
                <div id="empty-state" class="empty-state" hidden>
                    <span class="empty-icon">&#9776;</span>
                    <p class="empty-text">No tasks found</p>
                </div>
            </section>

            <footer class="app-footer">
                <div id="stats" class="stats"></div>
                <button id="clear-completed" class="btn btn-ghost" aria-label="Clear completed tasks">
                    Clear completed
                </button>
            </footer>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>TODO App</h1>
        <form id="todo-form" class="todo-form">
            <input
                type="text"
                id="todo-input"
                class="todo-input"
                placeholder="What needs to be done?"
                aria-label="New todo item"
                required
            >
            <button type="submit" class="btn btn-add" aria-label="Add todo">Add</button>
        </form>
        <div class="filters">
            <button class="btn btn-filter active" data-filter="all">All</button>
            <button class="btn btn-filter" data-filter="active">Active</button>
            <button class="btn btn-filter" data-filter="completed">Completed</button>
        </div>
        <ul id="todo-list" class="todo-list" aria-label="Todo items"></ul>
        <div id="todo-stats" class="todo-stats"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
